
scrollback_lines	5000
scrollback_pager_history_size 10

remember_window_size yes
initial_window_width 800
initial_window_height 400
window_padding_width 10 0 10 10

hide_window_decorations yes 

#Tab bar
tab_bar_min_tabs 1
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
tab_bar_min_tabs 2
#Ends Tab bar 

shell /usr/bin/zsh

notify_on_cmd_finish invisible 20

cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

window_logo_path /home/who/Documents/hollow_knight/ghost_term.png
window_logo_position bottom-right
window_logo_scale 100
window_logo_alpha 0.02
resize_debounce_time 0 0

background_opacity 0.9
background_blur 1

# BEGIN_KITTY_THEME
# Wizzy Bright
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="Hasklug Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
