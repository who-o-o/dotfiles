source = $HOME/.config/hypr/color.conf
$wall = $HOME/Documents/hollow_knight/windows_bg.png
$pfp = $HOME/Documents/hollow_knight/la-serenite.png
$battery = $HOME/.config/hypr/scripts/battery.sh
$battery_posx = 360
$battery_posy = -300
$music = $HOME/.config/hypr/scripts/music.sh
$albumart = $HOME/.config/hypr/scripts/albumart.sh

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 1000
}

background {
    monitor = 
    path = $wall

}

# EL MOT DE PASSE
input-field {
    monitor = 
    size = 350, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true 
    dots_rounding = -1
    rounding = 10
    outer_color = $ab_midnight
    inner_color = $h_white
    font_color = $ab_midnight
    font_family = FreeMono
    fade_on_empty = false 
    placeholder_text = Bapanada
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    halign = left
    valign = center
    position = 100, -130
}

#PFP
image {
    monitor = 
    path = $pfp
    size = 300
    rounding = -1
    border_size = 4
    border_color = $ab_midnight
    halign = left
    valign = center
    position = 115, 70
}


# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H":"%M")"
    color = $ke_offwhite
    shadow_size = 3
    shadow_color = $crossroads_marine
    shadow_boost = 1.2
    font_size = 100
    font_family = Abril Fatface 
    position = 100, 0
    halign = left
    valign = top
    zindex = 5
}


# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d"/"%m"/"%Y")"
    color = $ke_offwhite
    font_size = 20
    font_family = Abril Fatface
    position = 100, -170
    halign = left
    valign = top
    zindex = 5
}



# Battery div
shape {
    monitor =
    size = 130, 60
    color = $rw_light_green
    rounding = 15
    rotate = 0
    position = 320, -205
    halign = left
    valign = center
    zindex = 1
}

# Battery
label {
    monitor =
    text = cmd[update:1000] echo -e "$($battery)"
    color = $ke_offwhite
    font_size = 20
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 345, -205
    halign = left
    valign = center
    zindex = 5
}


# MUSIC
$mus_posx = 100
$mus_posy = 100
# Album art
image {
    monitor =
    path =  $HOME/.config/hypr/scripts/sherma.png # 
    reload_time = 2
    reload_cmd = $albumart
    size = 170
    rounding = 15
    border_size = 0
    position = 120, -280
    halign = left
    valign = center
    zindex = 5
}

# ── Song title ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] $music title
    color = rgba(255, 255, 255, 0.95)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    text_align = center
    position = 120, -400
    halign = left
    valign = center
}

# ── Artist name ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:2000]  $music artist
    color = rgba(180, 180, 180, 0.75)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    text_align = center
    position = 120, -420
    halign = left
    valign = center
    zindex = 5
}

# ── Play / Pause indicator ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] status=$(playerctl --player=firefox status 2>/dev/null); [[ "$status" == "Playing" ]] && echo "▶" || echo "⏸"
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    text_align = center
    position = 120, -440
    halign = left
    valign = center
    zindex = 5
}

shape {
    monitor = 
    size = 210, 290
    rounding = 15
    border_size = 4
    border_color = $rw_dark_marine
    halign = left
    valign = center
    position = 100, -320
    color = $fc_blue
    zindex = 0
}

image {
    monitor = 
    path = $HOME/Documents/hollow_knight/grubby.png
    rounding = 10
    border_size = 4
    border_color = $fc_beige
    halign = left
    valign = center
    position = 320, -355
    size = 120
}

label {
    monitor =
    # text = <i> Hi! $USER ;) </i>
    text = Bonsoir $USER 
    color = $ke_offwhite
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 30
    font_family = FreeMono
    position = 145, 260
    halign = left
    valign = center
}
